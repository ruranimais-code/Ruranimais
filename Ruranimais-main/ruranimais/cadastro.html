<head>
	<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">

<body><header class="site-header"><div class="container nav-wrap"><a class="brand" href="/">🐾 Ruranimais</a><nav><a href="/login">Entrar</a><a class="nav-cta" href="/cadastro">Criar conta</a></nav></div></header><main><div class="container flash-stack">__FLASH_MESSAGES__</div><section class="form-page"><div class="form-card"><p class="eyebrow">Faça parte da rede</p><h1>Criar conta</h1><p class="form-intro">Use seu e-mail institucional para colaborar com o cuidado no campus.</p><form method="post" action="/cadastro" id="signup-form"><label for="nome">Nome completo</label><input id="nome" name="nome" type="text" required autocomplete="name"><label for="email">E-mail institucional</label><input id="email" name="email" type="email" placeholder="nome@ufrpe.br" required autocomplete="email"><label for="senha">Senha <small>(mínimo de 6 caracteres)</small></label><input id="senha" name="senha" type="password" required minlength="6" autocomplete="new-password"><label for="confirmar_senha">Confirmar senha</label><input id="confirmar_senha" name="confirmar_senha" type="password" required minlength="6" autocomplete="new-password"><button class="button button-primary button-full" type="submit">Criar conta</button></form><p class="form-foot">Já possui uma conta? <a href="/login">Entrar</a></p></div></section></main><footer><div class="container">Ruranimais · Uma comunidade que cuida do campus UFRPE.</div></footer></body></html>
